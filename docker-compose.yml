# Quick start:
#   MYLITTLEPROXY_SIGNATURE_KEY=$(openssl rand -base64 32) docker compose up --build
#
# Edit docker/config.json first: allowedHosts has to match the domains your
# clients will ask for.
services:
  server:
    build: .
    ports:
      # Web traffic.
      - "8080:8080"
      # Control protocol, published to the host only. Clients connect here; keep
      # it off the public network.
      - "127.0.0.1:8081:8081"
    environment:
      # Left out of the config file on purpose, so the secret is not written to
      # disk next to the settings.
      MYLITTLEPROXY_SIGNATURE_KEY: ${MYLITTLEPROXY_SIGNATURE_KEY:?set MYLITTLEPROXY_SIGNATURE_KEY}
    volumes:
      - ./docker/config.json:/etc/mylittleproxy/config.json:ro
    restart: unless-stopped
