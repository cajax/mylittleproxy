# Quick start:
#   MYLITTLEPROXY_SIGNATURE_KEY=$(openssl rand -base64 32) docker compose up --build
#
# The whole configuration is here, so no config file is mounted. Set
# MYLITTLEPROXY_ALLOWED_HOSTS to the domains your clients will ask for.
services:
  server:
    build: .
    ports:
      # Web traffic.
      - "8080:8080"
      # Control protocol, published to the host only. Clients connect here; keep
      # it off the public network.
      - "127.0.0.1:8081:8081"
    environment:
      MYLITTLEPROXY_LISTEN: ":8080"
      MYLITTLEPROXY_LISTEN_CONTROL: ":8081"
      MYLITTLEPROXY_ALLOWED_HOSTS: '^.*\.example\.com$$'
      MYLITTLEPROXY_SIGNATURE_KEY: ${MYLITTLEPROXY_SIGNATURE_KEY:?set MYLITTLEPROXY_SIGNATURE_KEY}
    restart: unless-stopped
