# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.20'

    # Through the Makefile, so the build recipe people actually run is the one
    # that is tested.
    - name: Build
      run: make build

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test ./...
