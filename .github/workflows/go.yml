# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# The jobs only read the repository.
permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.20'

    # Through the Makefile, so the build recipe people actually run is the one
    # that is tested.
    - name: Build
      run: make build

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # golangci-lint needs a newer toolchain than the one the module targets.
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Lint
      uses: golangci/golangci-lint-action@v8
      with:
        # Pinned: a new release enabling more checks should be a deliberate
        # change, not a build that breaks on its own.
        version: v2.13.2
